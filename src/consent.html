<style>
.consent{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:1000;max-width:560px;margin-inline:auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--tile);color:var(--ink);font-size:14px;line-height:1.4;box-shadow:0 12px 32px rgba(0,0,0,.28)}
.consent[hidden]{display:none}
.consent p{flex:1 1 280px;margin:0}
.consent div{display:flex;gap:8px;margin-left:auto}
.consent button{min-height:40px;padding:0 18px;border:1px solid var(--line);border-radius:980px;background:transparent;color:var(--ink);font:inherit;cursor:pointer}
</style>
<div id="consent" class="consent" role="region" aria-label="Cookie choice" hidden>
  <p>With your OK, we use a Meta Pixel to measure our ads. <a href="/privacy/#website">Privacy Policy</a></p>
  <div><button type="button" data-consent="no">Decline</button><button type="button" data-consent="yes">Accept</button></div>
</div>
<script>
(function(){
  var KEY="spoon-consent",PIXEL="1867919934360605",PURCHASE={{PURCHASE}};
  var box=document.getElementById("consent"),loaded=false;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function drop(k){try{localStorage.removeItem(k)}catch(e){}}
  function start(){
    if(loaded)return;loaded=true;
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
    fbq("init",PIXEL);fbq("track","PageView");
    if(PURCHASE){var done="spoon-purchase:"+location.pathname;if(!get(done)){put(done,"1");fbq("track","Purchase",PURCHASE)}}
  }
  document.addEventListener("click",function(e){
    var t=e.target.closest&&e.target.closest("a,button");if(!t)return;
    var c=t.getAttribute("data-consent");
    if(c){put(KEY,c);box.hidden=true;if(c==="yes")start();else if(loaded)location.reload();return}
    if(t.id==="cookie-settings"){e.preventDefault();drop(KEY);box.hidden=false;return}
    if(loaded&&t.href&&t.href.indexOf("buy.stripe.com")>-1)fbq("track","InitiateCheckout",{content_name:t.getAttribute("aria-label")||t.textContent});
  });
  var s=get(KEY);if(s==="yes")start();else if(s!=="no")box.hidden=false;
})();
</script>
